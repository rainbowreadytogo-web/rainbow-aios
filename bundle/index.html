function h256(s){

  var H=[0x6a09e667,0xbb67ae85,0x3c6ef372,0xa54ff53a,0x510e527f,0x9b05688c,0x1f83d9ab,0x5be0cd19];

  for(i=0;i<l;i++) m[i>>2]=(m[i>>2]||0)|((s.charCodeAt(i)&0xff)<<(24-(i%4)*8));
  m[l>>2]=(m[l>>2]||0)|(0x80<<(24-(l%4)*8));
  var bl=(((l+8)>>6)+1)*16, bits=l*8;
  m[bl-2]=Math.floor(bits/4294967296); m[bl-1]=bits>>>0;
  for(i=0;i<bl;i+=16){
    var w=[],a=H[0],b=H[1],c=H[2],d=H[3],e=H[4],f=H[5],g=H[6],h=H[7];
    for(j=0;j<64;j++){
      var wv;
      if(j<16){ wv=m[i+j]||0; }
      else{
        var x15=w[j-15],x2=w[j-2];
        var s0=((x15>>>7)|(x15<<25))^((x15>>>18)|(x15<<14))^(x15>>>3);
        var s1=((x2>>>17)|(x2<<15))^((x2>>>19)|(x2<<13))^(x2>>>10);
        wv=(w[j-16]+s0+w[j-7]+s1)|0;
      }

      var ch=(e&f)^((~e)&g);

      var S0=((a>>>2)|(a<<30))^((a>>>13)|(a<<19))^((a>>>22)|(a<<10));
      var mj=(a&b)^(a&c)^(b&c);

      h=g;g=f;f=e;e=(d+t1)|0;d=c;c=b;b=a;a=(t1+t2)|0;
    }
    H[0]=(H[0]+a)|0;H[1]=(H[1]+b)|0;H[2]=(H[2]+c)|0;H[3]=(H[3]+d)|0;
    H[4]=(H[4]+e)|0;H[5]=(H[5]+f)|0;H[6]=(H[6]+g)|0;H[7]=(H[7]+h)|0;
  }
  var o="";
  for(i=0;i<8;i++) o+=("0000000"+(H[i]>>>0).toString(16)).slice(-8);
  return o;
